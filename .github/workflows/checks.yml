name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/check_public.py
      - run: python -m unittest discover -s tests -v
      - run: python eval/score.py --check
      - run: python eval/score_scenarios.py --check
      - run: python tools/progress.py && python tools/method.py
